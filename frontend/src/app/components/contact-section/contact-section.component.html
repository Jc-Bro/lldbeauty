<section class="contact-section" id="contact">
  <div class="contact-shell" style="grid-template-columns: repeat(1, minmax(0, 1fr)) !important;">
    <div class="details-column">
      <h2>{{ intro().title }}</h2>

      <div class="detail-list" style="display: flex; width: 100%;">
        <article class="detail-item" *ngFor="let detail of details()">
          <ng-container *ngIf="detail.icon === 'instagram'; else materialIcon">
            <svg
              class="detail-icon instagram-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="18" height="18" rx="5"></rect>
              <circle cx="12" cy="12" r="4.25"></circle>
              <circle cx="17.25" cy="6.75" r="1.25" class="instagram-dot"></circle>
            </svg>
          </ng-container>
          <ng-template #materialIcon>
            <span class="material-symbols-outlined detail-icon">{{ detail.icon }}</span>
          </ng-template>
          <div>
            <h3>{{ detail.title }}</h3>
            <ng-container *ngFor="let line of detail.lines">
              <a
                *ngIf="detail.href; else plainLine"
                [href]="detail.href"
                target="_blank"
                rel="noreferrer"
              >
                {{ line }}
              </a>
              <ng-template #plainLine>
                <p>{{ line }}</p>
              </ng-template>
            </ng-container>
          </div>
        </article>
      </div>
    </div>

        <button type="button">{{ intro().submitLabel }}</button>
      </form>
    </div> -->
  </div>
</section>
